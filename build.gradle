plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT' apply false
    id 'java-library'
}

group = 'net.silentclient.fent'
version = '2.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    modImplementation 'net.fabricmc:fabric-loader:0.19.1+1.21.11'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    modImplementation 'net.silentclient:silentclient12111:+'
}
